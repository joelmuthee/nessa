name = "thriftlux-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "58685495706b973821d77208248c66fc"

[[kv_namespaces]]
binding = "BAGS"
id = "3da577dc31c9474f80394b53caeabbe8"

# Workers AI — powers the IG sync widget's vision + text classifiers.
[ai]
binding = "AI"

# IG auto-sync — twice a day (owner ask 2026-06-12: owners post during the
# day, so afternoon + evening waves catch same-day posts). ThriftLux's fleet
# stagger offset is :20 past the wave hour (Iman holds :00 [disabled],
# Ryker :10). 10:20 UTC = 13:20 EAT, 16:20 UTC = 19:20 EAT.
[triggers]
crons = ["20 10 * * *", "20 16 * * *"]

# Auth token is set as a secret, not in this file:
#   wrangler secret put ADMIN_TOKEN

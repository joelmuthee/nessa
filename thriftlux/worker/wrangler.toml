name = "thriftlux-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "58685495706b973821d77208248c66fc"

[[kv_namespaces]]
binding = "BAGS"
id = "3da577dc31c9474f80394b53caeabbe8"

# Workers AI — powers the IG sync widget's vision + text classifiers.
[ai]
binding = "AI"

# IG auto-sync — 06:20 UTC = 09:20 EAT, ThriftLux's fleet stagger slot
# (Iman holds 06:00 [disabled], Ryker 06:10). See scheduled() in src/index.js.
[triggers]
crons = ["20 6 * * *"]

# Auth token is set as a secret, not in this file:
#   wrangler secret put ADMIN_TOKEN
